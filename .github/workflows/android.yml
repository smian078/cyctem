name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: timeout 5m gradle test --stacktrace

      - name: Build release APK
        run: timeout 7m gradle assembleRelease --stacktrace

      - name: Verify APK is signed and installable
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Smoke test release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$apk"

            adb install -r "$apk"

            adb shell am force-stop com.cystem
            adb logcat -c

            launch_output="$(adb shell am start -W -n com.cystem/.MainActivity 2>&1)"
            printf '%s\n' "$launch_output"

            sleep 5

            if ! adb shell pidof com.cystem >/dev/null 2>&1; then
              echo "CYSTEM process is not running after launch."
              adb logcat -d
              exit 1
            fi

            if adb logcat -d | grep -Eq 'FATAL EXCEPTION|Process: com\.cystem, PID:'; then
              echo "CYSTEM crashed during startup."
              adb logcat -d
              exit 1
            fi

            adb shell am force-stop com.cystem
